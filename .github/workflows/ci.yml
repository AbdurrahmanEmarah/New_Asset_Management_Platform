name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INVENTRA_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Inventra.slnx
      - name: Build
        run: dotnet build Inventra.slnx --no-restore -c Release
      - name: Check that migrations match the model
        run: |
          dotnet tool restore
          # Note: for dotnet ef, -c means --context, so the configuration must be spelled out.
          dotnet ef migrations has-pending-model-changes --project src/Services/Tenancy/Inventra.Tenancy --no-build --configuration Release
      - name: Test
        run: dotnet test Inventra.slnx --no-build -c Release --logger "console;verbosity=normal" --blame-hang-timeout 10m

  web:
    name: Web typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build --config apps/admin/vite.config.ts

  # Starts the whole platform through the AppHost (Docker: PostgreSQL, Keycloak) and drives the admin
  # console in Chromium. Takes several minutes, so it runs on main, integration and QA branches, and on demand.
  e2e:
    name: End-to-end (admin console in a browser)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/claude/integration-') ||
      startsWith(github.ref, 'refs/heads/claude/qa-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      INVENTRA_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web packages
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build the end-to-end tests
        run: dotnet build tests/EndToEnd/Inventra.EndToEnd.Tests -c Release
      - name: Install Chromium for Playwright
        run: pwsh tests/EndToEnd/Inventra.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Pull container images
        # Pulled up front so slow registries don't eat the tests' start-up time.
        run: |
          docker pull docker.io/library/postgres:18.3 &
          docker pull quay.io/keycloak/keycloak:26.6 &
          wait
      - name: Run the end-to-end tests
        run: dotnet test tests/EndToEnd/Inventra.EndToEnd.Tests --no-build -c Release --logger "console;verbosity=normal" --blame-hang-timeout 15m
      - name: Upload screenshots, traces and the stack log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
